name: Standalone Package Build

on:
  # Kept for maintainers who need to verify the inherited standalone build.
  # Libretro releases are produced by the Libretro build infrastructure, so
  # this workflow must never publish GitHub releases automatically.
  workflow_dispatch:
    inputs:
      opt:
        description: "Optimization flags"
        type: string
        default: "-O3 -g"

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      opt: ${{ github.event.inputs.opt || '-O3 -g' }}
