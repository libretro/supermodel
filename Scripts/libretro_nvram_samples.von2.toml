# Supermodel NVRAM sample campaign. Paths support ~ and environment variables.

[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "~/Library/Application Support/RetroArch/cores/supermodel_libretro.dylib"
rom_dir = "${SUPERMODEL_ROM_DIR}"
system_assets = "../Config"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "von2"
standard_srm = "~/Documents/RetroArch/model3-nvram-analysis/von2/game-base.srm"
output_dir = "~/Documents/RetroArch/model3-nvram-analysis/von2/generated"

# Common timings, in real seconds.
startup_wait = 8.0
button_hold = 0.06
button_hold_long = 0.12
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 15.0
window_width = 496
window_height = 384

# A macro may be a comma-separated string or an array of strings. Macros can
# reference other macros; *N repeats a button or macro. CLOSE performs the
# exact clean shutdown sequence Esc, wait, Esc on this RetroArch process only.
[macros]
EnterServ = "L3, WAIT(5.0)"
OpenGameAssignments = "R3*8, L3, WAIT(0.5)"
ExitServfromGame = "R3*4, L3, WAIT(7.0)"
SelectDifficultyType = "R3*1"
ExitDifficultyType = "R3*19, L3, WAIT(0.5)"
OpenCountryAssignments = "START*2, R3, START*3, R3*2, L3"
ExitServfromCountry = "R3*0, L3, WAIT(7.0)"
SelectCountryType = "R3*1"
ExitCountryType = "R3*5, L3, WAIT(0.5)"
# SelectCabinetType = "R3*3"
# ExitCabinetType = "R3*2, L3, WAIT(0.5)"
# ExitCabinetType01 = "R3*1, L3, WAIT(0.5)"
OpenNetAssignments = "@OpenGameAssignments"
ExitServfromNet = "@ExitServfromGame"
SelectLinkType = "R3*3"
ExitLinkType = "R3*17, L3, WAIT(0.5)"
ExitLinkType01 = "@ExitLinkType"
ExitLinkType02 = "@ExitLinkType"
SelectLinkId = "R3*4"
ExitLinkId = "R3*16, L3, WAIT(0.5)"
SelectDisplayType = "R3*17"
ExitDisplayType = "R3*3, L3, WAIT(0.5)"
Close = "CLOSE"

