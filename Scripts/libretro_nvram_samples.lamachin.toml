# Supermodel NVRAM sample campaign. Paths support ~ and environment variables.

[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "~/Library/Application Support/RetroArch/cores/supermodel_libretro.dylib"
rom_dir = "${SUPERMODEL_ROM_DIR}"
system_assets = "../Config"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "lamachin"
standard_srm = "~/Documents/RetroArch/model3-nvram-analysis/lamachin/game-base.srm"
output_dir = "~/Documents/RetroArch/model3-nvram-analysis/lamachin/generated"

# Common timings, in real seconds.
startup_wait = 5.0
button_hold = 0.06
button_hold_long = 0.12
default_wait = 0.2
settle_before_close = 0.5
close_gap = 0.7
shutdown_timeout = 15.0
window_width = 496
window_height = 384

# A macro may be a comma-separated string or an array of strings. Macros can
# reference other macros; *N repeats a button or macro. CLOSE performs the
# exact clean shutdown sequence Esc, wait, Esc on this RetroArch process only.
[macros]
EnterServ = "L3, WAIT(0.7)"
OpenGameAssignments = "R3*6, L3, WAIT(0.5)"
ExitServfromGame = "R3*5, L3, WAIT(4.0)"
SelectDifficultyType = "R3*1"
ExitDifficultyType = "R3*5, L3, WAIT(0.5)"
SelectCabinetType = "R3*5"
ExitCabinetType = "R3*1, L3, WAIT(0.5)"
ExitCabinetType01 = "R3*2, L3, WAIT(0.5)"
# SelectLinkComm = "R3*1"
# ExitLinkComm = "R3*1, L3, WAIT(0.5)"
# ExitLinkComm01 = "R3*3, L3, WAIT(0.5)"
# SelectLinkType = "R3*1, L3*1, R3*1"
# ExitLinkType = "R3*2, L3, WAIT(0.5)"
# SelectLinkId = "R3*1, L3*1, R3*2"
# ExitLinkId = "R3*1, L3, WAIT(0.5)"
OpenCountryAssignments = "START*2, R3, START*3, R3, L3, WAIT(0.5)"
ExitServfromCountry = "L3, WAIT(4.0)"
SelectCountryType = ""
ExitCountryType = "L3"
# OpenNetAssignments = "R3*9, L3, WAIT(0.5)"
# ExitServfromNet = "R3*5, L3, WAIT(4.0)"
Close = "CLOSE"

# Starting from the immutable DELUXE standard above, one press on Cabinet Type
# selects TWIN. The script copies the standard again before every other sample.
[[samples]]
suffix = "difficulty-00-level-05"
sequence = [
  "@EnterServ",
  "@OpenGameAssignments",
  "@SelectDifficultyType, L3*0, WAIT(0.5)",
  "@ExitDifficultyType",
  "@ExitServfromGame",
  "@Close",
]

